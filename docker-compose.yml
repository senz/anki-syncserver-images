version: '3.8'

services:
  anki-syncserver:
    image: ${IMAGE_NAME:-ghcr.io/senz/anki-syncserver:edge}
    container_name: anki-syncserver
    restart: unless-stopped
    ports:
      - "${SYNC_PORT:-8383}:8080"
    volumes:
      # - anki-syncserver-data:/anki_data
      - /portainer/Files/AppData/Config/anki-syncserver:/anki_data
    environment:
      # User credentials in format username:password
      # You can define multiple users: SYNC_USER1, SYNC_USER2, etc.
      - SYNC_USER1=${SYNC_USER1}
      # - SYNC_USER2=${SYNC_USER2}
      # - SYNC_USER3=${SYNC_USER3}
      # - SYNC_USER4=${SYNC_USER4}
      # - SYNC_USER5=${SYNC_USER5}
      # Additional environment variables can be added here
      # See: https://docs.ankiweb.net/sync-server.html
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

