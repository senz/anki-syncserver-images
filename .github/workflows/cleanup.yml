name: Cleanup Container Images

on:
  workflow_dispatch:
    inputs:
      keep_run_id_days:
        description: 'Keep run_id-tagged images newer than this many days (default: 7)'
        required: false
        type: string
        default: '7'
      dry_run:
        description: 'Dry run mode (list images but do not delete)'
        required: false
        type: boolean
        default: true
  # Uncomment to enable scheduled runs:
  # schedule:
  #   - cron: '0 2 * * 0'  # Every Sunday at 2 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anki-syncserver
  PACKAGE_TYPE: container

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set cleanup parameters
        id: params
        run: |
          KEEP_DAYS="${{ inputs.keep_run_id_days }}"
          if [ -z "$KEEP_DAYS" ] || [ "$KEEP_DAYS" = "null" ]; then
            KEEP_DAYS="7"
          fi

          DRY_RUN="${{ inputs.dry_run }}"
          if [ -z "$DRY_RUN" ] || [ "$DRY_RUN" = "null" ]; then
            DRY_RUN="true"
          fi

          echo "keep_days=$KEEP_DAYS" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Keep run_id images newer than $KEEP_DAYS days"
          echo "Dry run mode: $DRY_RUN"

      - name: List all package versions
        id: list_versions
        run: |
          echo "Fetching all package versions..."
          # For organization packages, API path should use only package name (without owner)
          # For user packages, it might include owner/package format
          PACKAGE_NAME_FULL="${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          PACKAGE_NAME_FULL_ESCAPED=$(echo "$PACKAGE_NAME_FULL" | sed 's|/|%2F|g')
          echo "Package name (full): $PACKAGE_NAME_FULL"
          echo "Package name (simple): $IMAGE_NAME"

          # Try user packages first (with owner/package format)
          if gh api "/user/packages/${PACKAGE_TYPE}/${PACKAGE_NAME_FULL_ESCAPED}/versions" --jq 'length' >/dev/null 2>&1; then
            API_PATH="/user/packages/${PACKAGE_TYPE}/${PACKAGE_NAME_FULL_ESCAPED}/versions"
            API_BASE="/user/packages/${PACKAGE_TYPE}/${PACKAGE_NAME_FULL_ESCAPED}"
            echo "Using user packages API (with owner)"
          # Try user packages with simple name
          elif gh api "/user/packages/${PACKAGE_TYPE}/${IMAGE_NAME}/versions" --jq 'length' >/dev/null 2>&1; then
            API_PATH="/user/packages/${PACKAGE_TYPE}/${IMAGE_NAME}/versions"
            API_BASE="/user/packages/${PACKAGE_TYPE}/${IMAGE_NAME}"
            echo "Using user packages API (simple name)"
          # Try organization packages (only simple name, no owner in path)
          elif gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/${PACKAGE_TYPE}/${IMAGE_NAME}/versions" --jq 'length' >/dev/null 2>&1; then
            API_PATH="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/${PACKAGE_TYPE}/${IMAGE_NAME}/versions"
            API_BASE="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/${PACKAGE_TYPE}/${IMAGE_NAME}"
            echo "Using organization packages API"
          else
            # Fallback: try org API with full name (for backwards compatibility)
            API_PATH="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/${PACKAGE_TYPE}/${PACKAGE_NAME_FULL_ESCAPED}/versions"
            API_BASE="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/${PACKAGE_TYPE}/${PACKAGE_NAME_FULL_ESCAPED}"
            echo "Using organization packages API (fallback with full name)"
          fi

          echo "API path: $API_PATH"
          echo "API base: $API_BASE"

          # First, try to get raw response to debug
          echo "Fetching raw API response..."
          RAW_RESPONSE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "$API_PATH" \
            --paginate 2>&1) || true

          if [ -z "$RAW_RESPONSE" ] || echo "$RAW_RESPONSE" | grep -q "Not Found"; then
            echo "⚠️  API returned error or empty response:"
            echo "$RAW_RESPONSE" | head -20
            echo "Package not found or no versions available yet"
            echo "[]" > /tmp/versions.json
            echo "$API_PATH" > /tmp/api_path.txt
            echo "$API_BASE" > /tmp/api_base.txt
            echo "version_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if response is an array
          if ! echo "$RAW_RESPONSE" | jq -e '. | type == "array"' >/dev/null 2>&1; then
            echo "⚠️  API response is not an array. First 500 chars:"
            echo "$RAW_RESPONSE" | head -c 500
            echo ""
            echo "Package not found or no versions available yet"
            echo "[]" > /tmp/versions.json
            echo "$API_PATH" > /tmp/api_path.txt
            echo "$API_BASE" > /tmp/api_base.txt
            echo "version_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get all package versions with proper error handling
          # Handle cases where tags might be null, missing, or empty
          if VERSIONS=$(echo "$RAW_RESPONSE" | jq -c '.[] | {
            id: .id,
            name: .name,
            updated_at: .updated_at,
            tags: (if .metadata.container.tags then .metadata.container.tags else [] end)
          }' 2>&1); then
            if [ -z "$VERSIONS" ]; then
              echo "⚠️  No versions found in response (empty array)"
              echo "[]" > /tmp/versions.json
            else
              echo "$VERSIONS" | jq -s '.' > /tmp/versions.json
              # Debug: show first few versions
              echo "Sample versions (first 3):"
              cat /tmp/versions.json | jq '.[0:3]' || true
            fi
            echo "$API_PATH" > /tmp/api_path.txt
            echo "$API_BASE" > /tmp/api_base.txt

            VERSION_COUNT=$(cat /tmp/versions.json | jq 'length')
            echo "Found $VERSION_COUNT package versions"
            echo "version_count=$VERSION_COUNT" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Error processing versions with jq:"
            echo "$VERSIONS" | head -20
            echo "Package not found or no versions available yet"
            echo "[]" > /tmp/versions.json
            echo "$API_PATH" > /tmp/api_path.txt
            echo "$API_BASE" > /tmp/api_base.txt
            echo "version_count=0" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify images to delete
        id: identify
        run: |
          KEEP_DAYS=${{ steps.params.outputs.keep_days }}
          # Calculate cutoff timestamp (portable date calculation)
          CURRENT_TIMESTAMP=$(date +%s)
          CUTOFF_TIMESTAMP=$((CURRENT_TIMESTAMP - KEEP_DAYS * 86400))

          CUTOFF_DATE=$(date -u -d "@$CUTOFF_TIMESTAMP" +"%Y-%m-%d %H:%M:%S UTC" 2>/dev/null || date -u -r "$CUTOFF_TIMESTAMP" +"%Y-%m-%d %H:%M:%S UTC" 2>/dev/null || echo "N/A")
          echo "Cutoff timestamp: $CUTOFF_TIMESTAMP ($CUTOFF_DATE)"

          # Patterns to identify temporary/cleanup candidates
          # 1. Images with run_id pattern: {version}-{variant}-{arch}-{run_id}
          # 2. Images with run_id in multi-arch manifest: {version}-{variant}-{run_id}
          # 3. Untagged images (no tags array or empty tags)

          TO_DELETE=()
          TO_KEEP=()

          # Check if versions file exists and has content
          if [ ! -f /tmp/versions.json ] || [ ! -s /tmp/versions.json ]; then
            echo "⚠️  No versions file found or file is empty"
            echo "delete_count=0" >> $GITHUB_OUTPUT
            echo "Summary:"
            echo "  Images to delete: 0"
            echo "  Images to keep: 0"
            exit 0
          fi

          VERSION_FILE_COUNT=$(cat /tmp/versions.json | jq 'length')
          echo "Processing $VERSION_FILE_COUNT versions from file..."

          # Process each version (jq -c '.[]' outputs nothing for empty arrays)
          while IFS= read -r version_data || [ -n "$version_data" ]; do
            # Skip if version_data is empty or not a valid JSON object
            if [ -z "$version_data" ] || ! echo "$version_data" | jq -e '.id' >/dev/null 2>&1; then
              continue
            fi

            VERSION_ID=$(echo "$version_data" | jq -r '.id')
            VERSION_NAME=$(echo "$version_data" | jq -r '.name')
            UPDATED_AT=$(echo "$version_data" | jq -r '.updated_at')
            TAGS=$(echo "$version_data" | jq -r '.tags[]?' | tr '\n' ' ')

            # Convert updated_at to timestamp using jq (handles ISO 8601)
            UPDATED_TIMESTAMP=$(echo "$version_data" | jq -r 'if .updated_at then (.updated_at | fromdateiso8601) else 0 end')
            if [ -z "$UPDATED_TIMESTAMP" ] || [ "$UPDATED_TIMESTAMP" = "null" ]; then
              UPDATED_TIMESTAMP=0
            fi
            AGE_DAYS=$(( (CURRENT_TIMESTAMP - UPDATED_TIMESTAMP) / 86400 ))

            # Check if untagged
            TAG_COUNT=$(echo "$version_data" | jq '.tags | length')
            if [ "$TAG_COUNT" -eq 0 ]; then
              echo "🗑️  Untagged image (ID: $VERSION_ID, Updated: $UPDATED_AT, Age: ${AGE_DAYS}d)"
              TO_DELETE+=("$VERSION_ID")
              continue
            fi

            # Check for run_id pattern in tags
            HAS_RUN_ID_TAG=false
            for tag in $TAGS; do
              # Pattern: {version}-{variant}-{arch}-{run_id} or {version}-{variant}-{run_id}
              if echo "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(standard|distroless)-(amd64|arm64)-[0-9]+$' || \
                 echo "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(standard|distroless)-[0-9]+$'; then
                HAS_RUN_ID_TAG=true
                break
              fi
            done

            if [ "$HAS_RUN_ID_TAG" = true ]; then
              if [ "$UPDATED_TIMESTAMP" -lt "$CUTOFF_TIMESTAMP" ]; then
                echo "🗑️  Old run_id-tagged image (ID: $VERSION_ID, Tags: $TAGS, Age: ${AGE_DAYS}d)"
                TO_DELETE+=("$VERSION_ID")
              else
                echo "✅ Keeping recent run_id-tagged image (ID: $VERSION_ID, Tags: $TAGS, Age: ${AGE_DAYS}d)"
                TO_KEEP+=("$VERSION_ID")
              fi
            else
              echo "✅ Keeping tagged image (ID: $VERSION_ID, Tags: $TAGS)"
              TO_KEEP+=("$VERSION_ID")
            fi
          done < <(cat /tmp/versions.json | jq -c '.[]')

          # Save IDs to delete
          if [ ${#TO_DELETE[@]} -gt 0 ]; then
            printf '%s\n' "${TO_DELETE[@]}" > /tmp/to_delete.txt
            echo "delete_count=${#TO_DELETE[@]}" >> $GITHUB_OUTPUT
          else
            touch /tmp/to_delete.txt
            echo "delete_count=0" >> $GITHUB_OUTPUT
          fi

          echo "Summary:"
          echo "  Images to delete: ${#TO_DELETE[@]}"
          echo "  Images to keep: ${#TO_KEEP[@]}"

      - name: Delete identified images
        if: steps.identify.outputs.delete_count > 0
        run: |
          DRY_RUN=${{ steps.params.outputs.dry_run }}
          API_BASE=$(cat /tmp/api_base.txt)

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN MODE - No images will be deleted"
            echo "Images that would be deleted:"
            while IFS= read -r version_id; do
              if [ -n "$version_id" ]; then
                VERSION_DATA=$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  "${API_BASE}/versions/$version_id" \
                  --jq '{id: .id, name: .name, updated_at: .updated_at, tags: [.metadata.container.tags[]?]}' 2>/dev/null || echo '{}')

                TAGS=$(echo "$VERSION_DATA" | jq -r '.tags[]?' 2>/dev/null | tr '\n' ',' | sed 's/,$//')
                echo "  - Version ID: $version_id, Tags: [$TAGS]"
              fi
            done < /tmp/to_delete.txt
          else
            echo "🗑️  Deleting images..."
            DELETED=0
            FAILED=0

            while IFS= read -r version_id; do
              if [ -n "$version_id" ]; then
                echo "Deleting version ID: $version_id"
                if gh api \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "${API_BASE}/versions/$version_id" 2>/dev/null; then
                  echo "✅ Successfully deleted version ID: $version_id"
                  DELETED=$((DELETED + 1))
                else
                  echo "❌ Failed to delete version ID: $version_id"
                  FAILED=$((FAILED + 1))
                fi
              fi
            done < /tmp/to_delete.txt

            echo "Deletion summary:"
            echo "  Successfully deleted: $DELETED"
            echo "  Failed: $FAILED"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total package versions found:** ${{ steps.list_versions.outputs.version_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Images identified for deletion:** ${{ steps.identify.outputs.delete_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run mode:** ${{ steps.params.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Keep run_id images newer than:** ${{ steps.params.outputs.keep_days }} days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.identify.outputs.delete_count }}" -eq 0 ]; then
            echo "✅ No images to clean up!" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            echo "🔍 Run with dry_run=false to actually delete the identified images." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Cleanup completed!" >> $GITHUB_STEP_SUMMARY
          fi
